name: flutter_portfolio
version: 1.0.0+1
publish_to: 'none'
description: Responsive one-page Flutter developer portfolio inspired by alicec0874203.github.io.

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  font_awesome_flutter: ^11.0.0
  simple_icons: ^16.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/projects/
    - assets/icons/
